name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.29.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the Bee Engine WASM is committed
        run: |
          test -f assets/bee/pkg/bee_sdk.js && test -f assets/bee/pkg/bee_sdk_bg.wasm \
            || { echo "::error::assets/bee/pkg/ is missing the built SDK — run tool/sync_bee_sdk.sh and commit it"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK will be debug-signed and won't update over release builds."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.p12
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.p12
          storeType=PKCS12
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # One universal APK — installs on every phone. (Per-ABI splits shave a few
      # MB each but mean picking the right file; not worth it for sideloading.)
      - name: Build APK
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Rename + verify signature
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk njd-miner.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs njd-miner.apk | grep -E "SHA-256|Signer #1" || true

      - uses: actions/upload-artifact@v4
        with:
          name: njd-miner-apk
          path: build/app/outputs/flutter-apk/njd-miner.apk
          if-no-files-found: error

  ios:
    needs: check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify the Bee Engine WASM is committed
        run: |
          test -f assets/bee/pkg/bee_sdk.js && test -f assets/bee/pkg/bee_sdk_bg.wasm \
            || { echo "::error::assets/bee/pkg/ is missing the built SDK"; exit 1; }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned build — no Apple Developer account / provisioning profile needed.
      # The resulting .ipa installs only on jailbroken devices or via a resigning
      # tool (AltStore, Sideloadly). Add signing secrets + `flutter build ipa
      # --export-options-plist` for a distributable build.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }}

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/Runner.app
          zip -qr njd-miner-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: njd-miner-ios-unsigned
          path: build/ios/iphoneos/njd-miner-unsigned.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
